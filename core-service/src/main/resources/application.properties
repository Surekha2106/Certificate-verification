# ===================================================================
# CertifyHub - Full Java Spring Boot Configuration
# ===================================================================
spring.application.name=certifyhub-core
server.port=8080

# -------------------------------------------------------------------
# 1. Primary Database: H2 (Zero-Setup Embedded In-Memory / File Mode)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:certifyhubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------
# 2. Production Database: MySQL (Uncomment to use MySQL)
# -------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/certifyhubdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------
# JPA / Hibernate Settings
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# Multipart File Upload Settings
# -------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# -------------------------------------------------------------------
# Static Web Resource Serving
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
